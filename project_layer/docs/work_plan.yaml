version: 1
plan_name: project_layer_runtime_alignment_work_plan
target: align project_layer runtime concepts, execution units, and runtime
  composition boundaries with the current requirement and architecture documents
sources:
  requirement_doc: project_layer/docs/Requirement.md
  architecture_doc: project_layer/docs/TechnicalArchitecture.md
  breakdown_docs_dir: project_layer/docs/breakdown_docs
  active_work_plan: project_layer/docs/work_plan.yaml
  code_root: project_layer/projects
principles:
  - keep document terminology, runtime terminology, artifact naming, and CLI
    entry semantics consistent
  - keep Basic Execution Units, Runtime Composition Modes, and quality-control
    concepts separated at plan level
  - remove legacy business concepts from primary runtime semantics as each
    execution-unit batch is implemented
  - prefer minimal necessary code change per batch
  - split model-alignment work from feature-addition work
  - do not mix unrelated refactors into the same batch
  - only mark work complete after code and tests are updated and verified
  - preserve stable logical artifact names defined by the design docs even when
    runtime compatibility layers remain active
execution_scope: concept-aligned execution-unit baseline and runtime-boundary
  follow-up with runtime schema naming work-execute residual cleanup
  post-alignment simplification and shared-directory removal
status: completed
current_focus:
  milestone_id: milestone_1_active_execution_alignment
  stage_id: stage_11_residual_alignment_follow_up
  residual_stage_id: residual_stage_11_3_legacy_cleanup
  batch_id: batch_11_3_2_legacy_cleanup
  task_id: task_11_3_2
deferred_after_first_batch_set:
  - full regression rename sweep across all historical tests
  - black-box end-to-end validation under the final naming model
  - deeper partition alignment for runtime, data store, llm capability, quality
    control, and test design breakdown docs
open_questions:
  - confirm whether item_design is a direct business rename of module_design or
    whether item selection must support non-module targets in v1
  - confirm whether architecture_design_contract should exist as a distinct
    runnable unit or stay as an internal contract runner behind
    architecture_design in v1
resolved_decisions:
  - work_plan.yaml is the only active execution baseline for the current
    implementation work
  - work_plan.yaml should use a real yaml structure and should not carry
    markdown content in a yaml path
  - a temporary compatibility layer for legacy stage identifiers is active
    during the first batch set
  - requirement_design, item_design, and work_plan generate and update baselines
    are already implemented and verified
  - the legacy stage runtime path has been removed from active runtime
    entrypoints and only compose-run interface placeholders remain until
    compose-run design is completed
  - current requirement and architecture documents still treat compose-run as a
    reserved current-version boundary, so the runtime keeps the placeholder
    behavior and does not implement richer multi-step orchestration in this
    batch
  - non-runtime protocol and shared helper naming has been narrowed from
    pipeline and document-stage terminology to execution-unit terminology where
    those paths remain active
  - Runtime/Schema is the chosen name for internal runtime boundary types
    because it is more precise than Protocols, Contracts, or Boundary in this
    project
milestones:
  - milestone_id: milestone_1_active_execution_alignment
    name: active execution alignment
    goal: align project_layer runtime concepts, execution units, and runtime
      composition boundaries with the current requirement and architecture
      documents
    status: in_progress
    stages:
      - stage_id: stage_1_model_alignment_baseline
        name: model alignment baseline
        goal: replace the legacy stage model with the current basic execution unit model
          at planning level and runtime boundary level
        status: completed
        batches:
          - batch_id: batch_1_1_plan_and_term_alignment
            name: execution plan and term alignment
            goal: establish one canonical vocabulary and one canonical execution model
            status: completed
            tasks:
              - task_id: task_1_1_1
                summary: establish work_plan.yaml as the active execution baseline and remove
                  dependency on the legacy markdown execution plan
                status: completed
                involved_files:
                  - project_layer/docs/work_plan.yaml
                expected_output:
                  - work_plan.yaml is the only active execution baseline for
                    current implementation work
              - task_id: task_1_1_2
                summary: define the canonical mapping between current document functional points
                  and runtime stage identifiers
                status: completed
                involved_files:
                  - project_layer/projects/sdlc/src/shared/contracts/pipeline.ts
                  - project_layer/projects/sdlc/src/app/composition-root.ts
                  - project_layer/projects/sdlc/src/interface/cli.ts
                expected_output:
                  - one stable naming model or one explicit compatibility
                    mapping layer
              - task_id: task_1_1_3
                summary: inventory and remove legacy hard-coded terminology from pipeline CLI
                  tests and runtime metadata
                status: completed
                involved_files:
                  - project_layer/projects/sdlc/src
                  - project_layer/projects/sdlc/tests
                expected_output:
                  - old stage names are either removed or isolated behind a
                    compatibility boundary
        validation:
          - no new plan or runtime entry uses the legacy stage names as the
            primary business vocabulary
          - CLI and registry can reference the canonical model consistently
