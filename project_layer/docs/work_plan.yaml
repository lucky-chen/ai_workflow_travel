version: 2
plan_name: project_layer_feature_delivery_work_plan
status: in_progress
target: deliver each documented SDLC feature as an independently usable capability,
  from runtime foundation to mock black-box usability and then real-llm usability
context:
  docs:
    requirement: project_layer/docs/Requirement.md
    architecture: project_layer/docs/TechnicalArchitecture.md
    breakdown_dir: project_layer/docs/breakdown_docs
  code:
    root: project_layer/projects
  active_work_plan: project_layer/docs/work_plan.yaml
  scope: feature-by-feature delivery plan for requirement architecture item
    overall-design-contract work-plan work-execute runtime entry black-box coverage
    and real-llm verification
workflow:
  current_focus:
    milestone_id: milestone_1_v1_current_delivery
    stage_id: work execute design alignment usable
    batch_id: batch_11_2_work_execute_design_alignment_verification
    task_name: verify work-execute prompt-action mock
  execution_rules:
    - finish all tasks in the current batch before advancing to the next batch in the same stage
    - a stage is completed only after all of its implementation and verification batches are completed
    - after a stage is completed, move current_focus to the first incomplete batch of the next stage
governance:
  principles:
    - each stage must deliver one feature or one directly usable system capability
    - each batch uses a fixed type label so implementation and verification are visually distinct
    - each feature stage may contain multiple small batches, but each batch must be either implementation or verification
    - each stage defines feature_scope explicitly, and each batch declares covers from that scope
    - generate update and contract stay as separate basic execution units
    - document contract rules come from template-extracted hints and contract json, not duplicated hand-coded business rules
    - a stage is only completed after code tests and artifact behavior are verified
    - runtime mock coverage and real-llm coverage are tracked separately
    - do not mark real-llm coverage complete until it is actually executed and stable
    - keep hello-service as the main black-box verification fixture
  decisions:
    resolved:
      - work_plan.yaml is the only active execution baseline for implementation tracking
      - technical design documents remain the design authority; when work_plan code or tests conflict with TechnicalArchitecture and breakdown docs, fix plan and implementation to match the technical docs
      - technical-design alignment tasks take precedence over pending verification cleanup when an existing implementation or test boundary is found to conflict with the technical docs
      - batch_type is restricted to implementation or verification
      - feature semantics are defined by stage feature_scope, while verification only provides evidence
      - document generate units create artifacts, while document update units return external-update handoff payloads instead of rewriting artifacts directly
      - document contract execution uses static-first checking and only runs llm semantic validation after static pass when llm is enabled
      - hello-service black-box tests use createWorkspaceCopy by default; direct in-place runs are reserved for manual debugging only
    open:
      - compose-run remains a reserved boundary in the current design docs and still lacks a completed usable delivery definition
milestones:
  - milestone_id: milestone_1_v1_current_delivery
    name: v1 current delivery
    goal: deliver the current-version usable SDLC capability set defined by the active requirement and architecture documents
    status: in_progress
    stages:
      - stage_id: runtime foundation usable
        goal: make runtime entry artifact persistence directory structure schema
          naming and runtime-unit orchestration usable for all later features
        status: completed
        delivered_feature: usable run-unit runtime foundation
        feature_scope:
          - runtime_entry
          - orchestrator_dispatch
          - workspace_paths
          - artifact_paths
          - trace_persistence
        batches:
          - batch_id: batch_0_1_runtime_entry_and_cli
            batch_type: implementation
            name: implementation
            goal: expose stable run unit and compose-run entry boundaries
            status: completed
            covers:
              - runtime_entry
              - orchestrator_dispatch
            tasks:
              - task_name: align cli request creation
                summary: align CLI and request creation with run unit and compose-run semantics
                status: completed
                involved_files:
                  - project_layer/projects/sdlc/src/Interface
                  - project_layer/projects/sdlc/tests/cli.test.ts
              - task_name: align runtime unit dispatch
                summary: align runtime and orchestrator boundaries with independent execution-unit dispatch
                status: completed
                involved_files:
                  - project_layer/projects/sdlc/src/Runtime
                  - project_layer/projects/sdlc/tests/runtime
          - batch_id: batch_0_2_runtime_paths_and_artifacts
