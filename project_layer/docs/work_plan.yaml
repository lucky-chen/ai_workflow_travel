version: 1
plan_name: project_layer_runtime_alignment_work_plan
target: align project_layer runtime and implementation plan with current requirement and architecture documents
sources:
  requirement_doc: project_layer/docs/Requirement.md
  architecture_doc: project_layer/docs/TechnicalArchitecture.md
  breakdown_docs_dir: project_layer/docs/breakdown_docs
  active_work_plan: project_layer/docs/work_plan.yaml
  code_root: project_layer/projects
principles:
  - keep document terminology, runtime terminology, artifact naming, and CLI entry semantics consistent
  - prefer minimal necessary code change per batch
  - split model-alignment work from feature-addition work
  - do not mix unrelated refactors into the same batch
  - only mark work complete after code and tests are updated and verified
execution_scope: first executable batch set only
status: in_progress
current_focus:
  stage_id: stage_2_document_unit_baseline
  batch_id: batch_2_3_item_design_units
  task_id: task_2_3_1
stages:
  - stage_id: stage_1_model_alignment_baseline
    name: model alignment baseline
    goal: replace the legacy stage model with the current basic execution unit model at planning level and runtime boundary level
    status: completed
    batches:
      - batch_id: batch_1_1_plan_and_term_alignment
        name: execution plan and term alignment
        goal: establish one canonical vocabulary and one canonical execution model
        status: completed
        tasks:
          - task_id: task_1_1_1
            summary: establish work_plan.yaml as the active execution baseline and remove dependency on the legacy markdown execution plan
            status: completed
            involved_files:
              - project_layer/docs/work_plan.yaml
            expected_output:
              - work_plan.yaml is the only active execution baseline for current implementation work
          - task_id: task_1_1_2
            summary: define the canonical mapping between current document functional points and runtime stage identifiers
            status: completed
            involved_files:
              - project_layer/projects/sdlc/src/shared/contracts/pipeline.ts
              - project_layer/projects/sdlc/src/app/composition-root.ts
              - project_layer/projects/sdlc/src/interface/cli.ts
            expected_output:
              - one stable naming model or one explicit compatibility mapping layer
          - task_id: task_1_1_3
            summary: inventory and remove legacy hard-coded terminology from pipeline CLI tests and runtime metadata
            status: completed
            involved_files:
              - project_layer/projects/sdlc/src
              - project_layer/projects/sdlc/tests
            expected_output:
              - old stage names are either removed or isolated behind a compatibility boundary
    validation:
      - no new plan or runtime entry uses the legacy stage names as the primary business vocabulary
      - CLI and registry can reference the canonical model consistently

  - stage_id: stage_2_document_unit_baseline
    name: document unit baseline
    goal: make requirement architecture item and work-plan units exist as real generator contract and runner flows
    status: in_progress
    batches:
      - batch_id: batch_2_1_requirement_design_units
        name: requirement design units
        goal: make requirement generate update and contract align with the current requirement document model
        status: completed
        tasks:
          - task_id: task_2_1_1
            summary: replace passthrough requirement generation with real requirement document generation
            status: completed
            involved_files:
              - project_layer/projects/sdlc/src/execution/requirement-generator.ts
              - project_layer/projects/sdlc/src/workflow/stage-runners/requirement-stage-runner.ts
              - project_layer/projects/sdlc/tests/requirement
          - task_id: task_2_1_2
            summary: update requirement contract checks to the current Requirement.md structure and terminology
            status: completed
            involved_files:
              - project_layer/projects/sdlc/src/contract/requirement-contract.ts
              - project_layer/projects/sdlc/tests/requirement
          - task_id: task_2_1_3
            summary: add requirement_design_update baseline with current external-update boundary semantics
            status: completed
            involved_files:
              - project_layer/projects/sdlc/src/execution
              - project_layer/projects/sdlc/src/workflow/stage-runners
              - project_layer/projects/sdlc/tests
      - batch_id: batch_2_3_item_design_units
        name: item design units
        goal: migrate module_design semantics to item_design semantics and keep one-target-per-run behavior
        status: in_progress
        tasks:
          - task_id: task_2_3_1
            summary: replace module_design business terminology with item_design in runtime contracts generators runners and tests
            status: pending
            involved_files:
              - project_layer/projects/sdlc/src/execution/module-design-generator.ts
              - project_layer/projects/sdlc/src/contract/module-design-contract.ts
              - project_layer/projects/sdlc/src/workflow/stage-runners/module-stage-runner.ts
              - project_layer/projects/sdlc/src/workflow/pipeline/module-design-fanout.ts
              - project_layer/projects/sdlc/tests/module-design
          - task_id: task_2_3_2
            summary: align architecture breakdown parsing and fan-out flow to item design targets instead of module naming assumptions
            status: pending
            involved_files:
              - project_layer/projects/sdlc/src/shared/design-document-breakdown.ts
              - project_layer/projects/sdlc/src/workflow/pipeline/module-design-fanout.ts
              - project_layer/projects/sdlc/tests/architecture
              - project_layer/projects/sdlc/tests/workflow
          - task_id: task_2_3_3
            summary: add item_design_update baseline with one target item per run
            status: pending
            involved_files:
              - project_layer/projects/sdlc/src/execution
              - project_layer/projects/sdlc/src/workflow/stage-runners
              - project_layer/projects/sdlc/tests
      - batch_id: batch_2_4_work_plan_units
        name: work plan units
        goal: migrate implementation_plan semantics to work_plan semantics and move the artifact to work_plan.yaml
        status: pending
        tasks:
          - task_id: task_2_4_1
            summary: replace implementation_plan business terminology with work_plan in generator contract runner CLI and tests
            status: pending
            involved_files:
              - project_layer/projects/sdlc/src/execution/implementation-plan-generator.ts
              - project_layer/projects/sdlc/src/contract/implementation-plan-contract.ts
              - project_layer/projects/sdlc/src/workflow/stage-runners/implementation-plan-stage-runner.ts
              - project_layer/projects/sdlc/src/interface/cli.ts
              - project_layer/projects/sdlc/tests/implementation-plan
          - task_id: task_2_4_2
            summary: switch the accepted plan artifact from markdown execution plan to work_plan.yaml while preserving stage batch task structure
            status: pending
            involved_files:
              - project_layer/projects/sdlc/src/execution/implementation-plan-generator.ts
              - project_layer/projects/sdlc/src/contract/implementation-plan-contract.ts
              - project_layer/projects/sdlc/src/workflow/stage-runners/stage-artifact-paths.ts
              - project_layer/projects/sdlc/tests
          - task_id: task_2_4_3
            summary: add work_plan_update baseline with current external-update boundary semantics
            status: pending
            involved_files:
              - project_layer/projects/sdlc/src/execution
              - project_layer/projects/sdlc/src/workflow/stage-runners
              - project_layer/projects/sdlc/tests
    validation:
      - direct unit runs exist for requirement design architecture design item design and work plan
      - work_plan artifact is emitted as yaml and preserves stage batch task structure
      - tests cover generator contract and runner success and failure cases
deferred_after_first_batch_set:
  - overall_design_contract implementation and runtime integration
  - work_execute and work_execute_contract split alignment
  - cli direct unit command redesign
  - compose-run canonical sequencing redesign
  - full regression rename sweep across all historical tests
  - black-box end-to-end validation under the final naming model
open_questions:
  - confirm whether item_design is a direct business rename of module_design or whether item selection must support non-module targets in v1
resolved_decisions:
  - work_plan.yaml is the only active execution baseline for the current implementation work
  - a temporary compatibility layer for legacy stage identifiers is active during the first batch set
