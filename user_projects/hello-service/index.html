<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Text Validation Client</title>
  </head>
  <body>
    <script type="module">
      import { ClientDispatcher } from "./src/client/client-dispatcher.js";
      import { ClientInterface } from "./src/client/client-interface.js";

      const dispatcher = new ClientDispatcher({
        endpointUrl: `${window.location.origin.replace(/:\d+$/, ":3000")}/validate`,
      });
      const clientInterface = new ClientInterface({ dispatcher, documentRef: window.document });
      clientInterface.render();
    </script>
  </body>
</html>
