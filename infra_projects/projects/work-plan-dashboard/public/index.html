<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Work Plan Dashboard</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <p class="eyebrow">Project Plan Dashboard</p>
        <h1 id="plan-name">Loading...</h1>
        <p id="plan-target" class="hero-copy"></p>
      </header>

      <main class="content-grid">
        <section class="panel summary-panel">
          <div class="panel-header">
            <div>
              <h2>Overall Summary</h2>
              <p id="selected-milestone" class="panel-subtitle">Milestone: loading</p>
            </div>
            <span id="plan-status" class="status-chip">loading</span>
          </div>
          <div id="top-summary" class="summary-grid"></div>
        </section>

        <section class="panel focus-panel">
          <div class="panel-header">
            <h2>Current Focus</h2>
          </div>
          <div id="current-focus" class="focus-card"></div>
        </section>

        <section class="panel stages-panel">
          <div class="panel-header">
            <h2>Stage Progress</h2>
            <label class="milestone-filter">
              <span>Milestone</span>
              <select id="milestone-select"></select>
            </label>
          </div>
          <div id="stages" class="stage-stack"></div>
        </section>

        <section class="panel notes-panel">
          <div class="panel-header">
            <h2>Open Questions</h2>
          </div>
          <div id="open-questions" class="list-stack"></div>
        </section>

        <section class="panel notes-panel">
          <div class="panel-header">
            <h2>Resolved Decisions</h2>
          </div>
          <div id="resolved-decisions" class="list-stack"></div>
        </section>
      </main>
    </div>

    <div id="detail-modal" class="detail-modal" hidden>
      <div id="detail-modal-backdrop" class="detail-modal-backdrop"></div>
      <div class="detail-modal-shell" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title">
        <div class="detail-modal-header">
          <div>
            <p id="detail-modal-kicker" class="task-detail-label">Detail</p>
            <h2 id="detail-modal-title">Detail</h2>
          </div>
          <button id="detail-modal-close" class="detail-modal-close" type="button" aria-label="Close detail">Close</button>
        </div>
        <div id="detail-modal-body" class="detail-modal-body"></div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
