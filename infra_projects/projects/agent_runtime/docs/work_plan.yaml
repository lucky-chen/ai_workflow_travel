version: 2
plan_name: agent_runtime_feature_delivery_work_plan
status: in_progress
target: deliver the standalone agent runtime sdk as one session-based multi-step runtime
  with stable result, trace, and observability boundaries
context:
  docs:
    design: infra_projects/projects/agent_runtime/docs/agent_runtime_design.md
  code:
    root: infra_projects/projects/agent_runtime
  active_work_plan: infra_projects/projects/agent_runtime/docs/work_plan.yaml
  scope: feature-by-feature delivery plan for agent runtime api, session lifecycle,
    context assembly, multi-step loop, trace, terminal usage, and real-llm verification
workflow:
  current_focus:
    milestone_id: milestone_6_agent_runtime_delivery
    stage_id: agent runtime core usable
    batch_id: batch_19_1_agent_runtime_api_and_session_implementation
    task_name: implement agent runtime public api and session lifecycle
  execution_rules:
    - finish all tasks in the current batch before advancing to the next batch in the same stage
    - a stage is completed only after all of its implementation and verification batches are completed
    - after a stage is completed, move current_focus to the first incomplete batch of the next stage
governance:
  principles:
    - each stage must deliver one feature or one directly usable system capability
    - each batch uses a fixed type label so implementation and verification are visually distinct
    - each feature stage may contain multiple small batches, but each batch must be either implementation or verification
    - each stage defines feature_scope explicitly, and each batch declares covers from that scope
    - a stage is only completed after code tests and artifact behavior are verified
    - runtime mock coverage and real-llm coverage are tracked separately
    - do not mark real-llm coverage complete until it is actually executed and stable
  decisions:
    resolved:
      - work_plan.yaml is the only active execution baseline for agent_runtime implementation tracking
      - use infra_projects/projects/agent_runtime/docs/agent_runtime_design.md as the direct design authority for runtime boundaries and naming
      - batch_type is restricted to implementation or verification
      - feature semantics are defined by stage feature_scope, while verification only provides evidence
    open:
      - request-level routing and step-level routing are not yet split into separate runtime modules
milestones:
  - milestone_id: milestone_6_agent_runtime_delivery
    name: agent runtime delivery
    goal: deliver the standalone agent runtime sdk defined by agent_runtime_design.md as one session-based multi-step runtime with stable result and observability boundaries
    status: in_progress
    stages:
      - stage_id: agent runtime core usable
        goal: make the documented AgentRuntime and AgentSession boundaries directly usable with session lifecycle context assembly multi-step loop and stable result contracts
        status: in_progress
        delivered_feature: agent runtime core
        feature_scope:
          - runtime_api
          - session_lifecycle
          - context_assembly
          - multi_step_runtime_loop
          - prompt_building
          - validation_chain
          - result_normalization
          - trace_metrics_boundary
        batches:
          - batch_id: batch_19_1_agent_runtime_api_and_session_implementation
            batch_type: implementation
            name: implementation
            goal: implement the documented agent runtime public api session handle and session lifecycle boundaries
            status: in_progress
            progress_notes:
              - use infra_projects/projects/agent_runtime/docs/agent_runtime_design.md as the direct design authority for runtime boundaries and naming
              - keep workdir as sdk-scoped configuration on createAgentRuntime rather than session-scoped input
              - keep public entry stable at AgentRuntime createSession openSession closeSession and AgentSession execute read
            covers:
              - runtime_api
              - session_lifecycle
            tasks:
              - task_name: implement runtime root api contract
                summary: implement AgentRuntime createSession openSession and closeSession according to the documented public contract
                status: pending
                involved_files:
                  - infra_projects/projects/agent_runtime/src/api
                  - infra_projects/projects/agent_runtime/src/runtime
                  - infra_projects/projects/agent_runtime/docs/agent_runtime_design.md
              - task_name: implement runtime agent session handle
                summary: implement AgentSession and RuntimeAgentSession so session-bound execute and read delegate through the runtime service
                status: pending
                involved_files:
                  - infra_projects/projects/agent_runtime/src/runtime
                  - infra_projects/projects/agent_runtime/src/api
                  - infra_projects/projects/agent_runtime/docs/agent_runtime_design.md
              - task_name: implement session manager lifecycle
                summary: implement AgentSessionManager session creation opening close semantics and session-state reads
                status: pending
                involved_files:
                  - infra_projects/projects/agent_runtime/src/runtime
                  - infra_projects/projects/agent_runtime/docs/agent_runtime_design.md
          - batch_id: batch_19_2_agent_runtime_context_implementation
            batch_type: implementation
            name: implementation
            goal: implement context assembly session history runtime memory retrieval and sdk-scoped workdir loading
            status: pending
            covers:
              - context_assembly
            tasks:
              - task_name: implement session history store
                summary: implement SessionHistoryStore load and transcript append behavior for the bound session
                status: pending
                involved_files:
                  - infra_projects/projects/agent_runtime/src/context
                  - infra_projects/projects/agent_runtime/src/runtime
                  - infra_projects/projects/agent_runtime/docs/agent_runtime_design.md
              - task_name: implement runtime memory and retrieval boundaries
                summary: implement RuntimeMemoryStore and RetrievalProvider-facing contracts with the documented runtime-owned boundaries
                status: pending
                involved_files:
                  - infra_projects/projects/agent_runtime/src/context
                  - infra_projects/projects/agent_runtime/docs/agent_runtime_design.md
              - task_name: implement context assembler
                summary: implement ContextAssembler with sdk-scoped workdir loading and bound-session context assembly
                status: pending
                involved_files:
