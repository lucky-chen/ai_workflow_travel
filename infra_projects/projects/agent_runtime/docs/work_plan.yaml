---
version: 2
plan_name: agent_runtime_code_generation_work_plan
status: in_progress
target: deliver the current AgentRuntime SDK defined by TechnicalArchitecture and
  breakdown_docs as one session-based runtime implementation, with new runtime source
  code generated under src_new
context:
  docs:
    architecture: infra_projects/projects/agent_runtime/docs/TechnicalArchitecture.md
    breakdown_dir: infra_projects/projects/agent_runtime/docs/breakdown_docs
  code:
    root: infra_projects/projects/agent_runtime
    source_root: infra_projects/projects/agent_runtime/src_new
  active_work_plan: infra_projects/projects/agent_runtime/docs/work_plan.yaml
  scope: feature-by-feature code generation plan for the current interface runtime
    controller agent orchestration context governance capability and tooling model
    integration observability data and application-layer design
workflow:
  current_focus:
    milestone_id: milestone_p1_single_agent_production_hardening
    stage_id: real provider mainline usable
    batch_id: batch_5_5_real_provider_verification
    task_name: verify live real-provider behavior
  execution_rules:
  - finish all tasks in the current batch before advancing to the next batch in the
    same stage
  - a stage is completed only after all of its implementation and verification batches
    are completed
  - after a stage is completed, move current_focus to the first incomplete batch of
    the next stage
governance:
  principles:
  - each stage must deliver one feature or one directly usable system capability
  - each batch uses a fixed type label so implementation and verification are visually
    distinct
  - each feature stage may contain multiple small batches, but each batch must be
    either implementation or verification
  - each stage defines feature_scope explicitly, and each batch declares covers from
    that scope
  - the technical architecture and breakdown docs are the design authority for naming
    boundaries and dependency direction
  - implementation code generation must place new runtime source files under src_new
    rather than extending the legacy src tree
  - placeholder boundaries must be implemented only to the level defined by the current
    docs and must not be expanded into active runtime behavior
  - a stage is only completed after code tests and artifact behavior are verified
  decisions:
    resolved:
    - work_plan.yaml is the only active execution baseline for the current agent_runtime
      rewrite
    - use TechnicalArchitecture.md and docs/breakdown_docs as the direct design authority
      instead of the legacy agent_runtime_design.md
    - src_new is the only target source root for newly generated runtime implementation
      code
    - milestone structure follows the phased implementation defined in TechnicalArchitecture.md
      section 8 as P0 P1 and P2
    - batch_type is restricted to implementation or verification
    - multi-agent protocol and run checkpoint remain reserved boundaries and are not
      part of the current mainline execution path
    - terminal session demo remains an application-layer adapter and must not introduce
      a second runtime stack
    open: []
